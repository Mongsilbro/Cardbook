<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>명함첩</title>
<meta name="apple-mobile-web-app-title" content="명함첩">
<meta name="theme-color" content="#23489a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: one narrow column of 90×50 mm card thumbnails; a full-screen sheet for add, edit and detail */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa; --line: #d7dde6;
  --fg: #18202b; --muted: #5d6878; --accent: #23489a; --accent-fg: #ffffff; --accent-soft: #e2e9f8;
  --danger: #b4232f;
  /* 아이폰 시스템 글꼴(SF + Apple SD Gothic Neo): 화면에서 가장 잘 읽히고 내려받을 것도 없음. 숫자는 고정폭 숫자(tabular-nums)로 줄 맞춤 */
  --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
  --font-mono: var(--font-body);
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151b; --surface: #1a2029; --surface-2: #212833; --line: #2e3744;
    --fg: #e7ebf1; --muted: #98a3b3; --accent: #8ea9ef; --accent-fg: #0f1520; --accent-soft: #24304a;
    --danger: #f07b84; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
  word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
img { max-width: 100%; }
.wrap {
  max-width: 680px; margin: 0 auto; display: grid; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 26px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.count { font-family: var(--font-mono); color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: inherit; font-weight: 500; border-radius: var(--r); padding: 12px 16px; min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.small { min-height: 38px; padding: 6px 10px; font-size: 15px; }
.btn[disabled] { opacity: .5; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; font-size: 0; }
.search { width: 100%; font: inherit; font-size: 16px; padding: 11px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.note b { color: var(--fg); font-weight: 500; }
.list { display: grid; gap: 10px; }
.item {
  display: grid; grid-template-columns: 108px 1fr; gap: 14px; align-items: center; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px; text-align: left; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent;
}
.thumb {
  width: 108px; aspect-ratio: 9 / 5; max-width: 100%; border-radius: 4px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--muted); font-family: var(--font-mono); font-size: 11px;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .meta { min-width: 0; display: grid; gap: 2px; }
.item .name { font-weight: 700; font-size: 16px; }
.item .name small { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 6px; }
.item .org, .item .tel { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .tel { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 28px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; background: var(--surface); }
.frame { width: min(240px, 100%); aspect-ratio: 9 / 5; position: relative; display: grid; place-items: center; color: var(--muted); font-family: var(--font-mono); font-size: 13px; letter-spacing: .02em; }
.frame::before, .frame::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--accent); border-radius: 6px; }
.frame::before { clip-path: polygon(0 0, 22% 0, 22% 6%, 6% 6%, 6% 22%, 0 22%, 0 78%, 6% 78%, 6% 94%, 22% 94%, 22% 100%, 0 100%); }
.frame::after { clip-path: polygon(78% 0, 100% 0, 100% 22%, 94% 22%, 94% 6%, 78% 6%, 78% 94%, 94% 94%, 94% 78%, 100% 78%, 100% 100%, 78% 100%); }
.empty h2 { margin: 0; font-size: 17px; }
.links { display: flex; gap: 4px 16px; flex-wrap: wrap; justify-content: center; }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 500; padding: 8px; min-height: 40px; -webkit-tap-highlight-color: transparent; }
.linkbtn.strong { font-weight: 700; }

.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.sheet-bar .in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.sheet-bar h2 { font-size: 16px; margin: 0; }
.sheet-body { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
.photo { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.photo img { display: block; width: 100%; }
.status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); font-size: 15px; }
.status.err { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

.aibox { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.dup { display: grid; gap: 10px; padding: 14px; border-radius: var(--r); border: 1.5px solid var(--accent); background: var(--accent-soft); }
.dup p, .nag p { margin: 0; }
.nag { display: grid; gap: 10px; padding: 14px; border-radius: var(--r); border: 1.5px solid var(--accent); background: var(--accent-soft); font-size: 15px; }
.nag .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#backupNag:empty { display: none; }
#dupBox:empty { display: none; }
.dup .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; color: var(--muted); display: grid; gap: 2px; }
.steps b { color: var(--fg); font-weight: 500; }

.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.group-title { font-size: 13px; color: var(--muted); letter-spacing: .02em; margin: 0 0 6px 4px; font-weight: 500; }
.field { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; padding: 4px 12px; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; }
.field label { color: var(--muted); font-size: 15px; }
.field input, .field textarea { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; padding: 10px 0; resize: vertical; }
.field textarea { min-height: 60px; }
.field.mono input { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hero-name { display: grid; gap: 2px; }
.hero-name .n { font-size: 24px; font-weight: 700; }
.hero-name .n small { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.hero-name .o { color: var(--muted); }
.quick { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.qbtn { display: grid; justify-items: center; gap: 4px; padding: 12px 8px; min-height: 64px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent); text-decoration: none; font-weight: 500; font-size: 15px; -webkit-tap-highlight-color: transparent; }
.qbtn:active { opacity: .7; }
.qbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .k { color: var(--muted); font-size: 15px; }
.row .v { min-width: 0; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.row .v.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.row .v a { color: var(--accent); text-decoration: none; }
.memo { white-space: pre-wrap; padding: 12px; -webkit-user-select: text; user-select: text; }
.stack { display: grid; gap: 10px; }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
.settings .field input { font-family: var(--font-mono); font-size: 16px; }
.photobox { display: grid; gap: 2px; }
.photobox .linkbtn { justify-self: center; font-size: 15px; }
.crop { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.crop-area { flex: 1; min-height: 0; display: grid; place-items: center; padding: 24px max(24px, env(safe-area-inset-left, 0px)) 24px max(24px, env(safe-area-inset-right, 0px)); }
.crop-fit { position: relative; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.crop-img, .crop-fit > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.crop-dim { fill: rgba(0, 0, 0, .5); }
.crop-edge { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
.handle { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; touch-action: none; cursor: grab; }
.handle::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .45); }
.loupe { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 2px 10px rgba(0, 0, 0, .5); pointer-events: none; background: #000; }
.crop-foot { width: 100%; max-width: 680px; margin: 0 auto; display: grid; gap: 10px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 40; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 15px; max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>명함첩</h1>
    <span class="count" id="count">0장</span>
  </header>

  <button class="btn primary" id="add" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="7" y="8" width="10" height="8" rx="1"/></svg>
    명함 추가
  </button>

  <div id="backupNag"></div>
  <input class="search" id="search" type="search" placeholder="이름, 회사, 전화번호 검색" autocomplete="off">
  <div id="list" class="list"></div>

  <div class="links">
    <button class="linkbtn" id="openSettings" type="button">AI 설정</button>
    <button class="linkbtn" id="openBackup" type="button">백업 · 복원</button>
  </div>
  <p class="note" style="text-align:center">명함은 이 아이폰의 Safari에만 저장됩니다. 가끔 백업해 두세요.</p>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="crop" id="crop" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  const FIELDS = [["name","이름"],["company","회사"],["department","부서"],["jobTitle","직함"],["mobile","휴대폰"],["phone","전화"],["fax","팩스"],["email","이메일"],["website","웹사이트"],["address","주소"],["memo","메모"]];
  const KEY_CARDS = "cardbook.cards.v1";
  const KEY_SAVED = "cardbook.savedAt.v1"; // 마지막 저장 시각. localStorage·IndexedDB 중 어느 쪽이 최신인지 가림
  const KEY_BACKUP = "cardbook.backup.v1"; // { at: 마지막 백업 파일 저장 시각, snooze: '나중에'를 누른 뒤 다시 알릴 시각 }
  const KEY_GEMINI = "cardbook.gemini.v1";
  const DEFAULT_MODEL = "gemini-3.5-flash-lite"; // 제미나이 중 가장 빠름, 무료
  const OLD_MODELS = ["gemini-3.6-flash"];        // 예전 기본값으로 저장된 설정은 새 기본값으로
  const DEFAULT_GROQ_MODEL = "qwen/qwen3.8-27b";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const digits = (s) => String(s || "").replace(/\D/g, "");
  const blankCard = () => Object.fromEntries(FIELDS.map(([k]) => [k, ""]));
  const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ================= storage =================
  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
  function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } }
  // 브라우저가 localStorage를 지워도 복구할 수 있게 IndexedDB와 쿠키에 한 벌 더 저장
  const idb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open("cardbook", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction("kv", mode); const req = fn(t.objectStore("kv"));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    }));
    return {
      get: (k) => tx("readonly", s => s.get(k)).catch(() => undefined),
      set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => undefined)
    };
  })();
  function setCookie(name, value) {
    try { document.cookie = `${name}=${encodeURIComponent(value)}; max-age=34560000; path=/; SameSite=Lax; Secure`; } catch {}
  }
  function getCookie(name) {
    try { const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : ""; } catch { return ""; }
  }
  // 주소 끝(#k=...)에 키를 담아 두면, 저장소가 지워져도 홈 화면 아이콘으로 열 때 다시 채워짐
  const b64e = (str) => btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const b64d = (str) => decodeURIComponent(escape(atob(str.replace(/-/g, "+").replace(/_/g, "/"))));
  const hasKey = (g) => !!(g && (g.key || g.groq));
  function geminiFromHash() {
    const m = location.hash.match(/[#&]k=([A-Za-z0-9_\-]+)/);
    if (!m) return null;
    try { const g = JSON.parse(b64d(m[1])); return hasKey(g) ? { key: g.key || "", model: g.model || "", groq: g.groq || "", groqModel: g.groqModel || "" } : null; } catch { return null; }
  }
  function keyHashUrl(g) {
    return location.origin + location.pathname + "#k=" + b64e(JSON.stringify({ key: g.key, model: g.model, groq: g.groq || undefined, groqModel: g.groqModel || undefined }));
  }
  function saveGemini(g) {
    gemini = g;
    store(KEY_GEMINI, g);
    idb.set(KEY_GEMINI, g);
    setCookie("cbk", hasKey(g) ? JSON.stringify(g) : "");
    try {
      if (hasKey(g)) history.replaceState(null, "", keyHashUrl(g));
      else history.replaceState(null, "", location.pathname);
    } catch {}
  }

  let cards = load(KEY_CARDS, []);
  let gemini = load(KEY_GEMINI, { key: "", model: DEFAULT_MODEL });
  (function restoreGeminiSync() {
    const fromHash = geminiFromHash();
    if (fromHash) { gemini = fromHash; store(KEY_GEMINI, gemini); idb.set(KEY_GEMINI, gemini); setCookie("cbk", JSON.stringify(gemini)); return; }
    if (!hasKey(gemini)) {
      try { const c = getCookie("cbk"); if (c) { const g = JSON.parse(c); if (hasKey(g)) { gemini = g; store(KEY_GEMINI, g); } } } catch {}
    }
  })();
  try { navigator.storage?.persist?.(); } catch {}
  const sortCards = () => cards.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  function saveCards() {
    const at = Date.now();
    idb.set(KEY_CARDS, cards); idb.set(KEY_SAVED, at);
    // localStorage(약 5MB)가 차면 사진을 빼고 글자만 저장. 사진은 IndexedDB(용량 넉넉)에 그대로 있고 앱을 열 때 다시 채움
    const ok = store(KEY_CARDS, cards) || store(KEY_CARDS, cards.map(c => ({ ...c, thumb: "" })));
    if (ok) store(KEY_SAVED, at);
    return ok;
  }
  sortCards();

  // ================= 전화번호 =================
  // 010-1234-5678 · 02-123-4567 · 1588-1234 꼴로. +82는 0으로. 알아볼 수 없는 형식이면 null
  function normalizePhone(raw) {
    let d = digits(raw);
    if (d.startsWith("82") && d.length >= 10) { d = d.slice(2); if (!d.startsWith("0")) d = "0" + d; }
    if (d.length === 8 && !d.startsWith("0")) return d.slice(0, 4) + "-" + d.slice(4);
    if (d.length < 9 || d.length > 11 || !d.startsWith("0")) return null;
    const a = d.startsWith("02") ? 2 : 3;
    const mid = d.slice(a, -4);
    if (mid.length < 3 || mid.length > 4) return null;
    return d.slice(0, a) + "-" + mid + "-" + d.slice(-4);
  }

  // ================= AI 읽기 (선택: 제미나이 + Groq) =================
  // 제미나이(한글 정확도 최고)를 먼저 보내고, 4초 안에 답이 없거나 실패하면 Groq(아주 빠름)도 보내 먼저 온 답을 씀
  const HEDGE_MS = 4000;
  const PROMPT = [
    "이 이미지는 명함 사진입니다. 인쇄된 정보를 읽어 JSON 객체 하나만 출력하세요.",
    "키: name, company, department, jobTitle, mobile, phone, fax, email, website, address, memo (모두 문자열).",
    "한글과 영문이 함께 있으면 한글 이름·회사명을 쓰고 영문 표기는 memo에. 전화번호는 하이픈 형식(010-1234-5678, 02-123-4567), +82는 0으로.",
    "010 등 휴대폰은 mobile, 대표·직통은 phone, 팩스는 fax. 이메일은 소문자. website는 http 없이. address는 한 줄로.",

          if (done) return;

  // ================= vCard → 아이폰 연락처 =================
  const vEsc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");

  // 모서리 4개를 끌어 명함 영역을 맞추는 화면. 결과: 사각형(자르기) / null(원본 그대로) / undefined(취소)
  function cropDialog(src, quad) {
    return new Promise(resolve => {
      const el = $("crop"), W = src.width, H = src.height;
      const pts = (quad || [[0, 0], [W, 0], [W, H], [0, H]]).map(p => p.slice());
      const view = drawScaled(src, 1400);
      el.innerHTML = `
        ${bar(`<button class="linkbtn" type="button" data-c="cancel">취소</button>`, "명함 영역", `<button class="linkbtn strong" type="button" data-c="ok">완료</button>`)}

          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="crop-dim" fill-rule="evenodd"/><polygon class="crop-edge"/></svg>
          ${[0, 1, 2, 3].map(i => `<div class="handle" data-i="${i}" aria-label="모서리 ${i + 1}"></div>`).join("")}
          <canvas class="loupe" width="224" height="224" hidden></canvas>
        </div></div>
        <div class="crop-foot">
          <p class="note">${quad ? "명함 테두리를 찾았습니다. 어긋난 모서리는 끌어서 맞추세요." : "테두리를 찾지 못했습니다. 네 모서리를 명함 귀퉁이로 끌어 주세요."}</p>
          <button class="btn" type="button" data-c="orig">자르지 않고 원본 사용</button>
        </div>`;
      const fit = $("cropFit"), area = $("cropArea"), loupe = fit.querySelector(".loupe"), lc = loupe.getContext("2d");
      view.className = "crop-img"; fit.prepend(view);
      el.hidden = false;
      const layout = () => {
        const cs = getComputedStyle(area);
        const aw = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const ah = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        const fw = Math.max(40, Math.min(aw, ah * W / H));
        fit.style.width = fw + "px"; fit.style.height = fw * H / W + "px";
      };
      const draw = () => {
        const poly = pts.map(p => p.join(",")).join(" ");
        fit.querySelector(".crop-edge").setAttribute("points", poly);
        fit.querySelector(".crop-dim").setAttribute("d", `M0 0H${W}V${H}H0Z M${pts.map(p => p.join(" ")).join(" L")}Z`);
        fit.querySelectorAll(".handle").forEach((hd, i) => { hd.style.left = pts[i][0] / W * 100 + "%"; hd.style.top = pts[i][1] / H * 100 + "%"; });
      };
      // 손가락에 가린 모서리를 확대해 보여 줌
      const showLoupe = (p) => {
        const k = view.width / W, z = 3, r = 112 / 2 / z / (fit.clientWidth / view.width);
        lc.fillStyle = "#000"; lc.fillRect(0, 0, 224, 224);
        lc.drawImage(view, p[0] * k - r, p[1] * k - r, r * 2, r * 2, 0, 0, 224, 224);
        lc.strokeStyle = "#fff"; lc.lineWidth = 2; lc.beginPath(); lc.moveTo(112, 92); lc.lineTo(112, 132); lc.moveTo(92, 112); lc.lineTo(132, 112); lc.stroke();
        const left = p[0] / W * fit.clientWidth, top = p[1] / H * fit.clientHeight, ox = fit.getBoundingClientRect().left;

      };

        e.preventDefault(); hd.setPointerCapture(e.pointerId);

  }

  function fillFields(parsed, overwriteAll) {
    if (!sheet || sheet.kind !== "edit") return 0;
    let n = 0;
    for (const [k] of FIELDS) {
      const el = $("f-" + k); if (!el) continue;
      if (sheet.dirty.has(k) && !overwriteAll) continue;

  // 같은 사람: 휴대폰이나 이메일이 같거나, 이름과 사무실 전화가 같음 (대표번호는 동료끼리 같을 수 있어 이름도 봄)
  function findDuplicate(c) {
    const mob = digits(c.mobile), em = (c.email || "").toLowerCase(), ph = digits(c.phone), nm = (c.name || "").replace(/\s/g, "");
    return cards.find(x => x.id !== c.id && (
      (mob.length >= 10 && digits(x.mobile) === mob) ||
      (em && (x.email || "").toLowerCase() === em) ||
      (nm && ph.length >= 8 && (x.name || "").replace(/\s/g, "") === nm && digits(x.phone) === ph)));
  }
  // 새 명함 내용이 우선(이직·승진 반영), 빈 칸은 기존 내용 유지, 메모는 이어 붙임
  function mergeCards(old, c) {
    const m = { ...old };
    for (const [k] of FIELDS) if (k !== "memo" && c[k]) m[k] = c[k];
    m.memo = [...new Set([old.memo, c.memo].filter(Boolean))].join("\n");
    if (c.thumb) m.thumb = c.thumb;
    return m;
  }
  function saveEdit(mode) {
    if (!sheet || sheet.kind !== "edit") return;
    let c = { ...sheet.card };
    for (const [k] of FIELDS) { const el = $("f-" + k); if (el) c[k] = el.value.trim(); }
    if (FIELDS.every(([k]) => !c[k])) { showToast("이름이나 연락처를 한 가지 이상 입력해 주세요."); return; }
    // 손으로 넣은 번호도 010-1234-5678 꼴로 (알아볼 수 없는 형식이면 그대로 둠)
    for (const k of ["mobile", "phone", "fax"]) { const n = c[k] && normalizePhone(c[k]); if (n) c[k] = n; }
    if (!c.id && mode !== "new") {
      const d = findDuplicate(c);
      if (d && mode === "merge") c = mergeCards(d, c);
      else if (d) {
        $("dupBox").innerHTML = `<div class="dup"><p><b>이미 저장된 명함과 같은 사람 같습니다.</b><br>${esc(d.name || "이름 없음")} · ${esc([d.company, d.jobTitle].filter(Boolean).join(" ") || d.mobile || d.email)}</p>
          <p class="note">합치면 새 명함 내용으로 바꾸고, 비어 있는 칸은 기존 내용을 그대로 둡니다.</p>
          <div class="row2"><button class="btn small primary" type="button" data-act="saveMerge">기존 명함에 합치기</button><button class="btn small" type="button" data-act="saveNew">따로 저장</button></div></div>`;
        $("sheet").scrollTop = 0;
        return;
      }
    }
    if (!c.id) { c.id = newId(); c.createdAt = Date.now(); }
    c.updatedAt = Date.now();
    const i = cards.findIndex(x => x.id === c.id);
    if (i >= 0) cards[i] = c; else cards.push(c);
    sortCards();
    if (!saveCards()) { showToast("저장하지 못했습니다. Safari 설정에서 방문 기록·웹사이트 데이터 차단을 확인해 주세요."); return; }
    renderList();
    showToast("저장했습니다");
    openDetail(c, true);
  }

  function openDetail(c, justSaved) {
    sheet = { kind: "detail", card: c, armed: false };
    const tel = (v) => v ? `<a href="tel:${esc(digits(v))}">${esc(v)}</a>` : "";
    const row = (label, value, o = {}) => !value ? "" : `<div class="row"><span class="k">${label}</span><span class="v ${o.mono ? "mono" : ""}">${o.html || esc(value)}</span><button class="btn small" type="button" data-copy="${esc(value)}">복사</button></div>`;
    const site = c.website ? (/^https?:\/\//i.test(c.website) ? c.website : "https://" + c.website) : "";
    const rows = [
      row("휴대폰", c.mobile, { mono: true, html: tel(c.mobile) }),
      row("전화", c.phone, { mono: true, html: tel(c.phone) }),
      row("팩스", c.fax, { mono: true }),
      row("이메일", c.email, { mono: true, html: `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` }),
      row("웹사이트", c.website, { mono: true, html: `<a href="${esc(site)}" target="_blank" rel="noopener">${esc(c.website)}</a>` }),
      row("주소", c.address, { html: `<a href="https://map.naver.com/p/search/${encodeURIComponent(c.address || "")}" target="_blank" rel="noopener">${esc(c.address)}</a>` })
    ].join("");
    // 자주 하는 연락은 큰 버튼으로: 전화(휴대폰 우선), 문자(휴대폰만), 메일
    const icon = (d) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    const callNum = c.mobile || c.phone;
    const quick = [
      callNum && `<a class="qbtn" href="tel:${esc(digits(callNum))}">${icon('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>')}전화</a>`,
      c.mobile && `<a class="qbtn" href="sms:${esc(digits(c.mobile))}">${icon('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>')}문자</a>`,
      c.email && `<a class="qbtn" href="mailto:${esc(c.email)}">${icon('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>')}메일</a>`
    ].filter(Boolean).join("");
    const created = c.createdAt ? new Date(c.createdAt).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" }) : "";
    openSheet(`
      ${bar(`<button class="linkbtn" type="button" data-act="close">‹ 목록</button>`, "명함", `<button class="linkbtn" type="button" data-act="edit">편집</button>`)}
      <div class="sheet-body">
        ${c.thumb ? `<div class="photo"><img src="${esc(c.thumb)}" alt="명함 사진"></div>` : ""}
        <div class="hero-name">
          <span class="n">${esc(c.name || "이름 없음")}${c.jobTitle ? `<small>${esc(c.jobTitle)}</small>` : ""}</span>
          ${c.company || c.department ? `<span class="o">${esc([c.company, c.department].filter(Boolean).join(" · "))}</span>` : ""}
        </div>
        ${quick ? `<div class="quick">${quick}</div>` : ""}
        <div class="stack">
          <button class="btn primary" type="button" data-act="contact">아이폰 연락처에 저장</button>
          ${justSaved ? `<p class="note">누른 뒤 뜨는 화면에서 <b>새로운 연락처 생성</b>을 누르면 저장됩니다.</p>` : ""}
        </div>
        ${rows ? `<div class="group">${rows}</div>` : `<p class="note">저장된 연락처가 없습니다.</p>`}
        ${c.memo ? `<div><p class="group-title">메모</p><div class="group memo">${esc(c.memo)}</div></div>` : ""}
        <button class="btn danger" type="button" data-act="delete">명함 삭제</button>
        ${created ? `<p class="foot">${esc(created)} 등록</p>` : ""}
      </div>`);
  }

  function openSettings() {
    sheet = { kind: "settings" };
    const inp = (id, v, ph, pw) => `<input id="${id}" ${pw ? 'type="password"' : ""} value="${esc(v)}" placeholder="${ph}" autocomplete="off" autocapitalize="off" autocorrect="off">`;
    openSheet(`
      ${bar(`<button class="linkbtn" type="button" data-act="close">닫기</button>`, "AI 설정", `<button class="linkbtn strong" type="button" data-act="saveSettings">저장</button>`)}
      <div class="sheet-body settings">
        <p class="note">키를 넣으면 <b>명함 사진</b>을 찍을 때 AI가 글자를 읽습니다. 둘 다 무료입니다.
          제미나이는 한글을 가장 정확히 읽고, Groq는 아주 빠릅니다. <b>둘 다 넣으면</b> 제미나이가 4초 안에 답하지 않거나 실패할 때 Groq가 이어받습니다.</p>
        <div><p class="group-title">제미나이 (추천)</p><div class="group">
          <div class="field"><label for="gKey">API 키</label>${inp("gKey", gemini.key, "AIza…", true)}</div>
          <div class="field"><label for="gModel">모델</label>${inp("gModel", geminiModel(), DEFAULT_MODEL)}</div>
        </div></div>
        <ol class="steps">
          <li><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--accent)">Google AI Studio</a>에 구글 계정으로 로그인</li>
          <li><b>Create API key</b>로 키를 만들어 복사한 뒤 위 칸에 붙여넣기</li>
          <li>무료 요금제는 보낸 내용이 구글 제품 개선에 쓰일 수 있습니다.</li>
        </ol>
        <div><p class="group-title">Groq (선택 · 예비)</p><div class="group">
          <div class="field"><label for="qKey">API 키</label>${inp("qKey", gemini.groq || "", "gsk_…", true)}</div>
          <div class="field"><label for="qModel">모델</label>${inp("qModel", groqModel(), DEFAULT_GROQ_MODEL)}</div>
        </div></div>
        <ol class="steps">
          <li><a href="https://console.groq.com/keys" target="_blank" rel="noopener" style="color:var(--accent)">GroqCloud</a>에 구글 계정 등으로 가입 (카드 등록 없음)</li>
          <li><b>Create API Key</b>로 키를 만들어 위 칸에 붙여넣기</li>
        </ol>
        <p class="note">키는 이 아이폰에만 저장되고, 명함 사진은 키를 넣은 회사(구글·Groq)로만 보냅니다.</p>
        ${hasKey(gemini) ? `<div class="status"><span>키가 저장되어 있습니다. 키를 다시 넣지 않으려면 <b>아래 순서로 홈 화면 아이콘을 한 번 다시 만들어 주세요.</b></span></div>
        <ol class="steps">
          <li>지금 주소창 주소 끝에 <b>#k=…</b>가 붙어 있습니다. 이 주소에 키가 담겨 있습니다.</li>
          <li>기존 홈 화면 아이콘을 지우고, 지금 화면에서 공유(□↑) → <b>홈 화면에 추가</b>를 누릅니다.</li>
          <li>이제 그 아이콘으로 열면 브라우저가 저장소를 지워도 키가 자동으로 다시 들어갑니다.</li>
          <li>이 주소는 다른 사람에게 보내지 마세요. 키가 함께 전달됩니다.</li>
        </ol>
        <button class="btn small" type="button" data-act="copyKeyUrl">키가 담긴 주소 복사 (북마크용)</button>` : ""}
        ${hasKey(gemini) ? `<button class="btn danger" type="button" data-act="clearKey">키 모두 지우기</button>` : ""}
      </div>`);
  }

  function openBackup() {
    sheet = { kind: "backup" };
    openSheet(`
      ${bar(`<button class="linkbtn" type="button" data-act="close">닫기</button>`, "백업 · 복원", "")}
      <div class="sheet-body">
        <p class="note">명함은 이 아이폰의 Safari에만 저장됩니다. Safari 방문 기록을 지우면 함께 지워지니 가끔 백업 파일을 '파일' 앱에 저장해 두세요.</p>
        <div class="stack">
          <button class="btn primary" type="button" data-act="exportJson" ${cards.length ? "" : "disabled"}>백업 파일 저장 (${cards.length}장)</button>
          <label class="btn filebtn">백업 파일에서 복원<input id="importIn" type="file" accept=".json,application/json"></label>
          <button class="btn" type="button" data-act="exportAllVcf" ${cards.length ? "" : "disabled"}>전체를 연락처 파일로 저장</button>
          <button class="btn" type="button" data-act="exportCsv" ${cards.length ? "" : "disabled"}>엑셀 파일(CSV)로 저장</button>
        </div>
      </div>`);
    $("importIn").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0]; e.target.value = "";
      if (!file) return;
      try {
        const arr = JSON.parse(await file.text());
        if (!Array.isArray(arr)) throw 0;
        let added = 0;
        for (const raw of arr) {
          if (!raw || typeof raw !== "object") continue;
          const c = { ...blankCard(), thumb: "" };
          for (const [k] of FIELDS) c[k] = typeof raw[k] === "string" ? raw[k] : "";
          c.thumb = typeof raw.thumb === "string" && raw.thumb.startsWith("data:image/") ? raw.thumb : "";
          c.id = typeof raw.id === "string" ? raw.id : newId();
          c.createdAt = Number(raw.createdAt) || Date.now();
          const i = cards.findIndex(x => x.id === c.id);
          if (i >= 0) cards[i] = c; else { cards.push(c); added++; }
        }
        sortCards(); saveCards(); renderList();
        showToast(`복원했습니다 (새 명함 ${added}장)`);
        closeSheet();
      } catch { showToast("백업 파일을 읽지 못했습니다."); }
    });
  }

  // ================= sheet events =================
  $("sheet").addEventListener("click", async (e) => {
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      try { await navigator.clipboard.writeText(cp.dataset.copy); showToast("복사했습니다"); }
      catch { showToast("복사하지 못했습니다. 글자를 길게 눌러 복사해 주세요."); }
      return;
    }
    const btn = e.target.closest("[data-act]");
    const act = btn?.dataset.act;
    if (!act) return;
    const s = sheet;
    if (act === "close") closeSheet();
    else if (act === "save") saveEdit();
    else if (act === "saveMerge") saveEdit("merge");
    else if (act === "saveNew") saveEdit("new");
    else if (act === "edit" && s) openEdit({ ...s.card });
    else if (act === "contact" && s) addToContacts(s.card);
    else if (act === "recrop" && s) recrop(s);
    else if (act === "openSettings") openSettings();
    else if (act === "delete" && s) {
      if (!s.armed) {
        s.armed = true; btn.classList.add("armed"); btn.textContent = "한 번 더 누르면 삭제됩니다";
        setTimeout(() => { if (sheet === s && s.armed) { s.armed = false; btn.classList.remove("armed"); btn.textContent = "명함 삭제"; } }, 4000);
        return;
      }
      cards = cards.filter(x => x.id !== s.card.id); saveCards(); renderList(); closeSheet(); showToast("삭제했습니다");
    }
    else if (act === "saveSettings") {
      saveGemini({ key: $("gKey").value.trim(), model: $("gModel").value.trim() === DEFAULT_MODEL ? "" : $("gModel").value.trim(), groq: $("qKey").value.trim(), groqModel: $("qModel").value.trim() === DEFAULT_GROQ_MODEL ? "" : $("qModel").value.trim() });
      if (hasKey(gemini)) { openSettings(); showToast("저장했습니다. 아래 안내대로 홈 화면에 추가해 주세요"); }
      else { closeSheet(); showToast("설정을 저장했습니다"); }
    }
    else if (act === "clearKey") {
      saveGemini({ key: "", model: geminiModel(), groq: "", groqModel: "" }); closeSheet(); showToast("키를 지웠습니다");
    }
    else if (act === "copyKeyUrl") {
      try { await navigator.clipboard.writeText(keyHashUrl(gemini)); showToast("주소를 복사했습니다"); }
      catch { showToast("복사하지 못했습니다. 주소창의 주소를 길게 눌러 복사해 주세요."); }
    }
    else if (act === "exportJson") exportBackup();
    else if (act === "exportCsv") {
      // 엑셀이 한글을 깨뜨리지 않게 UTF-8 BOM. 줄바꿈·쉼표·따옴표가 든 칸은 따옴표로 감쌈 (하이픈 있는 전화번호는 엑셀이 문자로 둠)
      const cell = (v) => { const t = String(v ?? ""); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
      const day = (t) => t ? new Date(t).toLocaleDateString("sv-SE") : "";
      const rows = [[...FIELDS.map(([, l]) => l), "등록일"], ...cards.map(c => [...FIELDS.map(([k]) => c[k]), day(c.createdAt)])];
      downloadFile(`명함첩-${day(Date.now())}.csv`, "\ufeff" + rows.map(r => r.map(cell).join(",")).join("\r\n"), "text/csv");
    }
    else if (act === "exportAllVcf") {
      downloadFile("명함첩-전체.vcf", cards.map(toVCard).join(""), "text/vcard");
    }
  });

  let toastTimer;
  function showToast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  // 테스트용 (브라우저 콘솔에서 확인 가능)
  window.__card = { findCardQuad, warpQuad, cardAspect };
  renderList();
  // 키가 있으면 주소에 담아 둠 (홈 화면 아이콘·북마크로 복구 가능)
  if (hasKey(gemini) && !geminiFromHash()) { try { history.replaceState(null, "", keyHashUrl(gemini)); } catch {} }

  // 두 저장소 맞추기: IndexedDB가 같거나 더 최신이면 그쪽(사진 포함)을 쓰고, 아니면 빠진 사진만 IndexedDB에서 채움
  (async () => {
    const [idbCards, idbGem, idbAt] = await Promise.all([idb.get(KEY_CARDS), idb.get(KEY_GEMINI), idb.get(KEY_SAVED)]);
    const lsAt = load(KEY_SAVED, 0);
    if (Array.isArray(idbCards) && idbCards.length) {
      if (!cards.length || (idbAt && idbAt >= lsAt)) {
        cards = idbCards;
        if (!load(KEY_CARDS, []).length) store(KEY_CARDS, cards) || store(KEY_CARDS, cards.map(c => ({ ...c, thumb: "" })));
      } else {
        const th = new Map(idbCards.filter(c => c.thumb).map(c => [c.id, c.thumb]));
        cards.forEach(c => { if (!c.thumb && th.has(c.id)) c.thumb = th.get(c.id); });
      }
      sortCards(); renderList();
    } else if (cards.length && !idbCards) {
      idb.set(KEY_CARDS, cards);
    }
    if (!hasKey(gemini) && hasKey(idbGem)) {
      saveGemini(idbGem);
    } else if (hasKey(gemini) && !hasKey(idbGem)) {
      idb.set(KEY_GEMINI, gemini);
    }
  })();
})();
</script>
</body>
</html>
