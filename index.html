<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>명함첩</title>
<meta name="apple-mobile-web-app-title" content="명함첩">
<meta name="theme-color" content="#23489a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column of 90×50 mm card thumbnails; a full-screen sheet for add, edit and detail */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa; --line: #d7dde6;
  --fg: #18202b; --muted: #5d6878; --accent: #23489a; --accent-fg: #ffffff; --accent-soft: #e2e9f8;
  --danger: #b4232f;
  --font-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151b; --surface: #1a2029; --surface-2: #212833; --line: #2e3744;
    --fg: #e7ebf1; --muted: #98a3b3; --accent: #8ea9ef; --accent-fg: #0f1520; --accent-soft: #24304a;
    --danger: #f07b84; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
img { max-width: 100%; }
.wrap {
  max-width: 680px; margin: 0 auto; display: grid; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 26px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.count { font-family: var(--font-mono); color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: inherit; font-weight: 500; border-radius: var(--r); padding: 12px 16px; min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; font-size: 0; }
.search { width: 100%; font: inherit; font-size: 16px; padding: 11px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note b { color: var(--fg); font-weight: 500; }
.list { display: grid; gap: 10px; }
.item {
  display: grid; grid-template-columns: 108px 1fr; gap: 14px; align-items: center; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px; text-align: left; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent;
}
.thumb {
  width: 108px; aspect-ratio: 9 / 5; max-width: 100%; border-radius: 4px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--muted); font-family: var(--font-mono); font-size: 11px;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .meta { min-width: 0; display: grid; gap: 2px; }
.item .name { font-weight: 700; font-size: 16px; }
.item .name small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.item .org, .item .tel { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .tel { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 28px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; background: var(--surface); }
.frame { width: min(240px, 100%); aspect-ratio: 9 / 5; position: relative; display: grid; place-items: center; color: var(--muted); font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; }
.frame::before, .frame::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--accent); border-radius: 6px; }
.frame::before { clip-path: polygon(0 0, 22% 0, 22% 6%, 6% 6%, 6% 22%, 0 22%, 0 78%, 6% 78%, 6% 94%, 22% 94%, 22% 100%, 0 100%); }
.frame::after { clip-path: polygon(78% 0, 100% 0, 100% 22%, 94% 22%, 94% 6%, 78% 6%, 78% 94%, 94% 94%, 94% 78%, 100% 78%, 100% 100%, 78% 100%); }
.empty h2 { margin: 0; font-size: 17px; }
.links { display: flex; gap: 4px 16px; flex-wrap: wrap; justify-content: center; }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 500; padding: 8px; min-height: 40px; -webkit-tap-highlight-color: transparent; }
.linkbtn.strong { font-weight: 700; }

.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.sheet-bar .in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.sheet-bar h2 { font-size: 16px; margin: 0; }
.sheet-body { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
.photo { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.photo img { display: block; width: 100%; }
.status { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); font-size: 14px; }
.status.err { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

.scanbox { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.scanbox textarea { width: 100%; min-height: 120px; font: inherit; font-size: 16px; border: 1px dashed var(--accent); border-radius: 8px; padding: 10px; background: var(--surface-2); color: var(--fg); resize: vertical; }
.scanbox .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.steps { margin: 0; padding-left: 20px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.steps b { color: var(--fg); font-weight: 500; }

.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.group-title { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin: 0 0 6px 4px; font-weight: 500; }
.field { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; padding: 4px 12px; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; }
.field label { color: var(--muted); font-size: 14px; }
.field input, .field textarea { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; padding: 10px 0; resize: vertical; }
.field textarea { min-height: 60px; }
.field.mono input { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hero-name { display: grid; gap: 2px; }
.hero-name .n { font-size: 24px; font-weight: 700; }
.hero-name .n small { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.hero-name .o { color: var(--muted); }
.row { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .k { color: var(--muted); font-size: 14px; }
.row .v { min-width: 0; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.row .v.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.row .v a { color: var(--accent); text-decoration: none; }
.memo { white-space: pre-wrap; padding: 12px; -webkit-user-select: text; user-select: text; }
.stack { display: grid; gap: 10px; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
.settings .field input { font-family: var(--font-mono); font-size: 14px; }
.photobox { display: grid; gap: 2px; }
.photobox .linkbtn { justify-self: center; font-size: 14px; }
.crop { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.crop-area { flex: 1; min-height: 0; display: grid; place-items: center; padding: 24px max(24px, env(safe-area-inset-left, 0px)) 24px max(24px, env(safe-area-inset-right, 0px)); }
.crop-fit { position: relative; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.crop-img, .crop-fit > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.crop-dim { fill: rgba(0, 0, 0, .5); }
.crop-edge { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
.handle { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; touch-action: none; cursor: grab; }
.handle::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .45); }
.loupe { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 2px 10px rgba(0, 0, 0, .5); pointer-events: none; background: #000; }
.crop-foot { width: 100%; max-width: 680px; margin: 0 auto; display: grid; gap: 10px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 40; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>명함첩</h1>
    <span class="count" id="count">0장</span>
  </header>

  <button class="btn primary" id="add" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="7" y="8" width="10" height="8" rx="1"/></svg>
    명함 추가
  </button>

  <input class="search" id="search" type="search" placeholder="이름, 회사, 전화번호 검색" autocomplete="off">
  <div id="list" class="list"></div>

  <div class="links">
    <button class="linkbtn" id="openSettings" type="button">제미나이 설정</button>
    <button class="linkbtn" id="openBackup" type="button">백업 · 복원</button>
  </div>
  <p class="note" style="text-align:center">명함은 이 아이폰의 Safari에만 저장됩니다. 가끔 백업해 두세요.</p>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="crop" id="crop" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  const FIELDS = [["name","이름"],["company","회사"],["department","부서"],["jobTitle","직함"],["mobile","휴대폰"],["phone","전화"],["fax","팩스"],["email","이메일"],["website","웹사이트"],["address","주소"],["memo","메모"]];
  const KEY_CARDS = "cardbook.cards.v1";
  const KEY_GEMINI = "cardbook.gemini.v1";
  const DEFAULT_MODEL = "gemini-3.6-flash";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const digits = (s) => String(s || "").replace(/\D/g, "");
  const blankCard = () => Object.fromEntries(FIELDS.map(([k]) => [k, ""]));
  const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ================= storage =================
  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
  function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } }
  // 브라우저가 localStorage를 지워도 복구할 수 있게 IndexedDB와 쿠키에 한 벌 더 저장
  const idb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open("cardbook", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction("kv", mode); const req = fn(t.objectStore("kv"));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    }));
    return {
      get: (k) => tx("readonly", s => s.get(k)).catch(() => undefined),
      set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => undefined)
    };
  })();
  function setCookie(name, value) {
    try { document.cookie = `${name}=${encodeURIComponent(value)}; max-age=34560000; path=/; SameSite=Lax; Secure`; } catch {}
  }
  function getCookie(name) {
    try { const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : ""; } catch { return ""; }
  }
  // 주소 끝(#k=...)에 키를 담아 두면, 저장소가 지워져도 홈 화면 아이콘으로 열 때 다시 채워짐
  const b64e = (str) => btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const b64d = (str) => decodeURIComponent(escape(atob(str.replace(/-/g, "+").replace(/_/g, "/"))));
  function geminiFromHash() {
    const m = location.hash.match(/[#&]k=([A-Za-z0-9_\-]+)/);
    if (!m) return null;
    try { const g = JSON.parse(b64d(m[1])); return g && typeof g.key === "string" && g.key ? { key: g.key, model: g.model || DEFAULT_MODEL } : null; } catch { return null; }
  }
  function keyHashUrl(g) {
    return location.origin + location.pathname + "#k=" + b64e(JSON.stringify({ key: g.key, model: g.model }));
  }
  function saveGemini(g) {
    gemini = g;
    store(KEY_GEMINI, g);
    idb.set(KEY_GEMINI, g);
    setCookie("cbk", g.key ? JSON.stringify(g) : "");
    try {
      if (g.key) history.replaceState(null, "", keyHashUrl(g));
      else history.replaceState(null, "", location.pathname);
    } catch {}
  }

  let cards = load(KEY_CARDS, []);
  let gemini = load(KEY_GEMINI, { key: "", model: DEFAULT_MODEL });
  (function restoreGeminiSync() {
    const fromHash = geminiFromHash();
    if (fromHash) { gemini = fromHash; store(KEY_GEMINI, gemini); idb.set(KEY_GEMINI, gemini); setCookie("cbk", JSON.stringify(gemini)); return; }
    if (!gemini.key) {
      try { const c = getCookie("cbk"); if (c) { const g = JSON.parse(c); if (g?.key) { gemini = g; store(KEY_GEMINI, g); } } } catch {}
    }
  })();
  try { navigator.storage?.persist?.(); } catch {}
  const sortCards = () => cards.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  function saveCards() {
    idb.set(KEY_CARDS, cards);
    if (store(KEY_CARDS, cards)) return true;
    // 저장 공간이 부족하면 사진을 빼고 다시 시도
    showToast("저장 공간이 부족해 명함 사진 없이 저장합니다.");
    return store(KEY_CARDS, cards.map(c => ({ ...c, thumb: "" })));
  }
  sortCards();

  // ================= parser (명함 글자 → 항목) =================
  const P = {
    email: /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/,
    phone: /(?<!\d)(?:(?:\+\s?82|82)[\s.\-]*(?:\(0\))?[\s.\-]*\d{1,2}|0\d{1,2}|\(0\d{1,2}\))[\s.)\-]*\d{3,4}[\s.\-]*\d{4}(?!\d)|(?<!\d)1[5-9]\d{2}[\s.\-]\d{4}(?!\d)/g,
    website: /\b(?:https?:\/\/)?(?:www\.)?[a-z0-9\-]+(?:\.[a-z0-9\-]+)*\.(?:co\.kr|go\.kr|or\.kr|ac\.kr|re\.kr|com|net|org|kr|io|biz|info|co)(?:\/\S*)?\b/i,
    region: /^\(?\d{0,5}\)?\s*(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충청|충북|충남|전라|전북|전남|경상|경북|경남|제주)/,
    addrLabel: /^(주소|본사|공장|사무소|address|addr)\s*[.:：]?\s*|^(a|add)\s*[.:：]\s*/i,
    addrCont: /(\d+층|\d+호|빌딩|타워|센터|플라자|오피스|아파트|\(.*동\))/,
    engTitle: /\b(ceo|cto|cfo|coo|president|vice president|director|manager|engineer|researcher|professor|team leader|head of|partner|consultant|designer|developer|specialist|officer|associate|assistant|senior|principal)\b/i
  };
  const TITLES = ["대표이사","대표","부회장","회장","부사장","사장","전무이사","전무","상무이사","상무","부이사관","이사관","이사","본부장","사업부장","실장","국장","부장","차장","과장","대리","주임","사원","팀장","파트장","그룹장","센터장","소장","원장","지점장","선임연구원","책임연구원","수석연구원","주임연구원","연구위원","연구원","선임","책임","수석","매니저","프로","주무관","사무관","서기관","기술서기관","교수","부교수","조교수","변호사","변리사","회계사","세무사","노무사","기술사","고문","위원","감사","공학박사","박사"].sort((a, b) => b.length - a.length);
  const TITLE_SET = new Set(TITLES);
  const SURNAMES = new Set("김이박최정강조윤장임한오서신권황안송류유전홍고문양손배백허남심노하곽성차주우구민진나지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모탁국어은편용예경봉사부라빈피");
  const COMPOUND = ["남궁","황보","제갈","선우","독고","사공","서문","동방"];
  const STOP = new Set(["대표","본사","공장","지사","지점","주소","전화","팩스","휴대폰","홈페이지","이메일","사무실","고객센터","대표번호","직통","내선","명함","본점","영업","기술","관리","기획"]);
  const COMPANY_WORDS = ["주식회사","(주)","㈜","(유)","유한회사","재단법인","사단법인","협동조합","협회","공사","공단","그룹","은행","증권","보험","병원","의원","대학교","연구원","연구소","진흥원","평가원","co.,","co.","corp","inc","ltd","llc","gmbh","company","corporation"];
  const SEP = /[\s\/|,·:：()\[\]]+/;

  function koreanName(t) {
    const c = String(t).replace(/[\s·.]/g, "");
    if (!/^[가-힣]{2,4}$/.test(c) || STOP.has(c)) return null;
    if (c.length === 4) return COMPOUND.some(s => c.startsWith(s)) ? c : null;
    if (!SURNAMES.has(c[0])) return null;
    if (c.length === 3 && /[시군]$/.test(c)) return null;
    return c;
  }
  function englishName(t) {
    if (/[가-힣]/.test(t) || t.length > 30) return null;
    return /^[A-Z][A-Za-z'.\-]+([ \-]+[A-Z][A-Za-z'.\-]+){1,2}$/.test(t) ? t : null;
  }
  function isCompany(t) {
    const low = t.toLowerCase();
    if (COMPANY_WORDS.some(w => low.includes(w))) return true;
    const c = t.replace(/\s/g, "");
    if (/(시청|도청|구청|군청|교육청|특별시|광역시|특별자치도|특별자치시)$/.test(c)) return true;
    return c.length >= 3 && /^[가-힣]{2,}(부|청|처|위원회)$/.test(c);
  }
  function isDepartment(t) {
    const c = t.replace(/\s/g, "");
    if (c.length > 25) return false;
    if (c.length >= 3 && /(팀|과|본부|사업부|사업단|부문|센터|그룹|파트|담당관)$/.test(c)) return true;
    if (c.length >= 4 && /(실|국|단)$/.test(c)) return true;
    return /\b(team|dept\.?|department|division|office|lab)$/i.test(t);
  }
  function isAddress(t) {
    if (t.length < 6) return false;
    if (P.region.test(t)) return true;
    if (/[가-힣0-9]+(로|길)\s?\d+/.test(t)) return true;
    return /[가-힣]+(시|구|군)\s/.test(t) && /[가-힣]+(동|리|읍|면)\s?\d+/.test(t);
  }
  function normalizePhone(raw) {
    let d = digits(raw);
    if (d.startsWith("82") && d.length >= 10) { d = d.slice(2); if (!d.startsWith("0")) d = "0" + d; }
    if (d.length === 8 && !d.startsWith("0")) return d.slice(0, 4) + "-" + d.slice(4);
    if (d.length < 9 || d.length > 11 || !d.startsWith("0")) return null;
    const a = d.startsWith("02") ? 2 : 3;
    const mid = d.slice(a, -4);
    if (mid.length < 3 || mid.length > 4) return null;
    return d.slice(0, a) + "-" + mid + "-" + d.slice(-4);
  }
  function extractPhones(text) {
    const out = []; let cursor = 0;
    for (const m of text.matchAll(P.phone)) {
      const label = text.slice(cursor, m.index).toLowerCase().replace(/[^a-z가-힣]/g, "");
      cursor = m.index + m[0].length;
      const num = normalizePhone(m[0]);
      if (!num) continue;
      const fax = (label.includes("fax") || label.includes("팩스") || label.endsWith("f")) && !(label.includes("tel") && label.includes("fax"));
      out.push({ kind: num.startsWith("01") ? "mobile" : fax ? "fax" : "office", num });
    }
    return out;
  }
  function splitTitle(text) {
    const tokens = text.split(SEP).filter(Boolean);
    const found = tokens.filter(t => TITLE_SET.has(t));
    if (found.length) return [found.join(" "), tokens.filter(t => !TITLE_SET.has(t)).join(" ")];
    const c = text.replace(/\s/g, "");
    for (const t of TITLES) {
      if (c.endsWith(t) && c.length > t.length) {
        const pre = c.slice(0, -t.length);
        if (koreanName(pre)) return [t, pre];
      }
    }
    return [null, text];
  }

  function parseCardText(text) {
    const d = blankCard();
    const left = [], names = [], engNames = [];
    let lastAddr = false;
    const lines = String(text).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    for (const raw of lines) {
      let used = false;
      if (lastAddr && P.addrCont.test(raw) && !extractPhones(raw).length) { d.address += " " + raw; continue; }
      lastAddr = false;
      if (/[@＠]/.test(raw)) {
        const m = raw.replace(/＠/g, "@").replace(/\s*@\s*/g, "@").replace(/\s*\.\s*(?=[a-z]{2,}\b)/gi, ".").match(P.email);
        if (m) { if (!d.email) d.email = m[0].toLowerCase(); used = true; }
      }
      for (const p of extractPhones(raw)) {
        used = true;
        if (p.kind === "mobile" && !d.mobile) d.mobile = p.num;
        else if (p.kind === "fax" && !d.fax) d.fax = p.num;
        else if (p.kind === "office" && !d.phone) d.phone = p.num;
      }
      const noMail = raw.split(" ").filter(w => !/[@＠]/.test(w)).join(" ");
      const site = noMail.match(P.website);
      if (site) { const s = site[0].toLowerCase(); if (!d.website && !d.email.endsWith(s)) d.website = s; used = true; }
      if (!used) {
        const st = raw.replace(P.addrLabel, "").trim();
        if (isAddress(st)) { if (!d.address) { d.address = st; lastAddr = true; } else left.push(raw); used = true; }
      }
      if (used) continue;

      const [title, rest] = splitTitle(raw);
      if (title && !d.jobTitle) d.jobTitle = title;
      const r = rest.trim();
      if (!r) continue;
      const bonus = title ? 2 : 1;
      if (isCompany(r)) { if (!d.company) d.company = r; else if (!d.department) d.department = r; else left.push(raw); continue; }
      if (isDepartment(r)) { if (!d.department) d.department = r; else left.push(raw); continue; }
      const kn = koreanName(r);
      if (kn) { names.push({ n: kn, s: bonus, i: names.length }); continue; }
      if (!/[가-힣]/.test(r) && r.split(" ").length <= 6 && P.engTitle.test(r)) { if (!d.jobTitle) d.jobTitle = r; else left.push(raw); continue; }
      const en = englishName(r);
      if (en) { engNames.push(en); continue; }
      if (/\s/.test(r) && /(다|요|니다)[.!~]?$/.test(r)) { left.push(raw); continue; } // 문장(슬로건 등)은 통째로 메모
      const unknown = []; let any = false;
      for (const tok of r.split(SEP).filter(Boolean)) {
        if (isDepartment(tok) && !d.department) { d.department = tok; any = true; }
        else if (koreanName(tok)) { names.push({ n: koreanName(tok), s: bonus, i: names.length }); any = true; }
        else unknown.push(tok);
      }
      if (!any) left.push(raw); else if (unknown.length) left.push(unknown.join(" "));
    }
    names.sort((a, b) => b.s - a.s || a.i - b.i);
    if (names.length) { d.name = names[0].n; left.push(...names.slice(1).map(x => x.n), ...engNames); }
    else if (engNames.length) { d.name = engNames[0]; left.push(...engNames.slice(1)); }
    d.memo = left.join("\n");
    return d;
  }

  // ================= Gemini (선택) =================
  async function readWithGemini(jpegBlob) {
    const b64 = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(",")[1]);
      fr.onerror = rej;
      fr.readAsDataURL(jpegBlob);
    });
    const prompt = [
      "이 이미지는 명함 사진입니다. 인쇄된 정보를 읽어 JSON 객체 하나만 출력하세요.",
      "키: name, company, department, jobTitle, mobile, phone, fax, email, website, address, memo (모두 문자열).",
      "한글과 영문이 함께 있으면 한글 이름·회사명을 쓰고 영문 표기는 memo에. 전화번호는 하이픈 형식(010-1234-5678, 02-123-4567), +82는 0으로.",
      "010 등 휴대폰은 mobile, 대표·직통은 phone, 팩스는 fax. 이메일은 소문자. website는 http 없이. address는 한 줄로.",
      "칸에 넣지 못한 정보는 memo에 줄바꿈으로. 없는 항목은 빈 문자열. 인쇄된 글자만 옮기고 추측하지 마세요."
    ].join("\n");
    const model = (gemini.model || DEFAULT_MODEL).trim();
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": gemini.key.trim() },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }],
        generationConfig: { responseMimeType: "application/json", temperature: 0 }
      })
    });
    if (!res.ok) {
      let msg = "";
      try { msg = (await res.json())?.error?.message || ""; } catch {}
      const e = new Error(msg || ("HTTP " + res.status)); e.status = res.status; throw e;
    }
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
    return JSON.parse(text.replace(/^```(?:json)?|```$/g, "").trim());
  }

  // ================= image =================
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("사진을 열 수 없습니다.")); };
      img.src = url;
    });
  }
  function drawScaled(img, maxSide) {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const s = Math.min(1, maxSide / Math.max(iw, ih));
    const cv = document.createElement("canvas");
    cv.width = Math.round(iw * s); cv.height = Math.round(ih * s);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return cv;
  }

  // ================= 명함 영역 찾기 · 펴기 (배경 지우기) =================
  // 사진을 작게 줄여 경계선을 구하고, 직선(허프 변환) 중 네 개가 이루는 사각형 가운데 테두리가 가장 뚜렷한 것을 고른다.
  function orderCorners(pts) { // → [왼위, 오위, 오아래, 왼아래]
    const cx = pts.reduce((a, p) => a + p[0], 0) / 4, cy = pts.reduce((a, p) => a + p[1], 0) / 4;
    const s = pts.slice().sort((p, q) => Math.atan2(p[1] - cy, p[0] - cx) - Math.atan2(q[1] - cy, q[0] - cx));
    const k = s.reduce((bi, p, i) => p[0] + p[1] < s[bi][0] + s[bi][1] ? i : bi, 0);
    return [0, 1, 2, 3].map(i => s[(k + i) % 4]);
  }
  function blur3(a, w, h) {
    const t = new Float32Array(a.length);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      t[i] = (a[x > 0 ? i - 1 : i] + a[i] + a[x < w - 1 ? i + 1 : i]) / 3;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      a[i] = (t[y > 0 ? i - w : i] + t[i] + t[y < h - 1 ? i + w : i]) / 3;
    }
  }
  function findCardQuad(src) {
    const sc = Math.min(1, 400 / Math.max(src.width, src.height));
    const w = Math.round(src.width * sc), h = Math.round(src.height * sc), n = w * h;
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const cx = cv.getContext("2d", { willReadFrequently: true });
    cx.drawImage(src, 0, 0, w, h);
    const px = cx.getImageData(0, 0, w, h).data;
    // 색 채널마다 흐리게 한 뒤 소벨 경사, 가장 센 채널을 씀 (배경과 명함이 밝기는 비슷하고 색만 다른 경우 대비)
    const ch = [0, 1, 2].map(c => { const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = px[i * 4 + c]; blur3(a, w, h); blur3(a, w, h); return a; });
    const mag = new Float32Array(n), gxs = new Float32Array(n), gys = new Float32Array(n);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x; let best = 0, bx = 0, by = 0;
      for (const a of ch) {
        const gx = a[i - w + 1] + 2 * a[i + 1] + a[i + w + 1] - a[i - w - 1] - 2 * a[i - 1] - a[i + w - 1];
        const gy = a[i + w - 1] + 2 * a[i + w] + a[i + w + 1] - a[i - w - 1] - 2 * a[i - w] - a[i - w + 1];
        const m = gx * gx + gy * gy;
        if (m > best) { best = m; bx = gx; by = gy; }
      }
      mag[i] = Math.sqrt(best); gxs[i] = bx; gys[i] = by;
    }
    // 경사 방향으로 가늘게(비최대 억제) + 문턱값
    const T = 16, edge = new Uint8Array(n);
    for (let y = 2; y < h - 2; y++) for (let x = 2; x < w - 2; x++) {
      const i = y * w + x, m = mag[i]; if (m < T) continue;
      const ax = Math.abs(gxs[i]), ay = Math.abs(gys[i]);
      const o = ay < ax * 0.414 ? 1 : ax < ay * 0.414 ? w : (gxs[i] * gys[i] > 0 ? w + 1 : w - 1);
      if (m >= mag[i - o] && m >= mag[i + o]) edge[i] = 1;
    }
    // 허프 변환: 각 점은 자기 경사 방향 근처 각도에만, 경사 세기만큼 투표 (약한 무늬보다 뚜렷한 가장자리가 이김)
    const NT = 180, diag = Math.ceil(Math.hypot(w, h)), NR = 2 * diag + 1;
    const COS = [], SIN = [];
    for (let t = 0; t < NT; t++) { COS.push(Math.cos(t * Math.PI / NT)); SIN.push(Math.sin(t * Math.PI / NT)); }
    const acc = new Float32Array(NT * NR);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (!edge[i]) continue;
      const t0 = Math.round(Math.atan2(gys[i], gxs[i]) * 180 / Math.PI);
      for (let k = -3; k <= 3; k++) {
        const t = (((t0 + k) % 180) + 180) % 180;
        acc[t * NR + Math.round(x * COS[t] + y * SIN[t]) + diag] += mag[i];
      }
    }
    const minV = 0.12 * Math.min(w, h) * 24, peaks = [];
    for (let t = 0; t < NT; t++) for (let r = 0; r < NR; r++) {
      const v = acc[t * NR + r]; if (v < minV) continue;
      let isMax = true;
      for (let dt = -3; dt <= 3 && isMax; dt++) {
        let tt = t + dt, rr = r;
        if (tt < 0 || tt >= NT) { tt = (tt + NT) % NT; rr = 2 * diag - r; }
        for (let dr = -4; dr <= 4; dr++) {
          const r2 = rr + dr; if ((dt || dr) && r2 >= 0 && r2 < NR && acc[tt * NR + r2] > v) { isMax = false; break; }
        }
      }
      if (isMax) peaks.push({ th: t * Math.PI / NT, r: r - diag, v });
    }
    peaks.sort((a, b) => b.v - a.v);
    const angDiff = (a, b) => { const d = Math.abs(a.th - b.th); return Math.min(d, Math.PI - d); };
    const rhoDiff = (a, b) => Math.abs(a.r - (Math.abs(a.th - b.th) > Math.PI / 2 ? -b.r : b.r));
    // 나뭇결·줄무늬 배경이 같은 방향 직선만 잔뜩 내놓지 않도록 비슷한 각도는 5개까지만
    const lines = [];
    for (const p of peaks) {
      if (lines.length >= 24) break;
      if (lines.some(l => angDiff(l, p) < 5 * Math.PI / 180 && rhoDiff(l, p) < 6)) continue;
      if (lines.filter(l => angDiff(l, p) < 8 * Math.PI / 180).length >= 5) continue;
      lines.push(p);
    }
    const meet = (a, b) => {
      const ca = Math.cos(a.th), sa = Math.sin(a.th), cb = Math.cos(b.th), sb = Math.sin(b.th), det = ca * sb - sa * cb;
      return [(a.r * sb - sa * b.r) / det, (ca * b.r - a.r * cb) / det];
    };
    // 변 위의 점들이 실제 경계선(방향까지 맞는)에 얼마나 붙어 있는지. 둥근 모서리 대비 양 끝 10%는 뺀다
    const support = (p, q) => {
      const len = Math.hypot(q[0] - p[0], q[1] - p[1]), ux = (q[0] - p[0]) / len, uy = (q[1] - p[1]) / len;
      let hit = 0, tot = 0, sum = 0;
      for (let s = len * 0.1; s <= len * 0.9; s += 1) {
        const x = p[0] + ux * s, y = p[1] + uy * s; tot++;
        for (let o = -1.5; o <= 1.5; o += 1) {
          const xi = Math.round(x - uy * o), yi = Math.round(y + ux * o);
          if (xi < 0 || yi < 0 || xi >= w || yi >= h) continue;
          const i = yi * w + xi;
          if (edge[i] && Math.abs(gxs[i] * uy - gys[i] * ux) > 0.9 * mag[i]) { hit++; sum += mag[i]; break; }
        }
      }
      return { f: tot ? hit / tot : 0, m: hit ? sum / hit : 0 };
    };
    const pairs = [];
    for (let i = 0; i < lines.length; i++) for (let j = i + 1; j < lines.length; j++)
      if (angDiff(lines[i], lines[j]) < 40 * Math.PI / 180 && rhoDiff(lines[i], lines[j]) > 0.15 * Math.min(w, h)) pairs.push([lines[i], lines[j]]);
    const cands = [];
    for (let i = 0; i < pairs.length; i++) for (let j = i + 1; j < pairs.length; j++) {
      const [a, b] = pairs[i], [c, e] = pairs[j];
      if ([[a, c], [a, e], [b, c], [b, e]].some(([l, m]) => angDiff(l, m) < 50 * Math.PI / 180)) continue;
      const q = [meet(a, c), meet(a, e), meet(b, e), meet(b, c)];
      if (q.some(([x, y]) => !(x > -0.02 * w && x < 1.02 * w && y > -0.02 * h && y < 1.02 * h))) continue;
      let area = 0;
      for (let k = 0; k < 4; k++) area += q[k][0] * q[(k + 1) % 4][1] - q[(k + 1) % 4][0] * q[k][1];
      area = Math.abs(area) / 2;
      if (area < 0.08 * w * h) continue;
      const sup = q.map((p, k) => support(p, q[(k + 1) % 4]));
      if (Math.min(...sup.map(x => x.f)) < 0.3) continue;
      const score = sup.reduce((x, y) => x + y.f, 0) / 4, strength = sup.reduce((x, y) => x + y.m, 0) / 4;
      cands.push({ q, area, score, rank: score * Math.sqrt(strength) * Math.pow(area, 0.1) });
    }
    if (!cands.length) return null;
    // 테두리가 끊김 없이 이어지고(score) 대비가 센(strength) 사각형. 나뭇결처럼 약한 무늬 선보다 명함 가장자리가 이김
    const best = cands.filter(c => c.score >= 0.5).sort((a, b) => b.rank - a.rank)[0];
    if (!best) return null;
    // 경계선 위치 오차로 배경이 실처럼 남지 않게 중심 쪽으로 1.5% 당김
    const mx = best.q.reduce((t, p) => t + p[0], 0) / 4, my = best.q.reduce((t, p) => t + p[1], 0) / 4;
    return orderCorners(best.q.map(([x, y]) => [x + (mx - x) * 0.015, y + (my - y) * 0.015])
      .map(([x, y]) => [Math.min(src.width, Math.max(0, x / sc)), Math.min(src.height, Math.max(0, y / sc))]));
  }

      if (sheet !== s) return;
      const n = fillFields(result || {}, false);
      setStatus(n ? "제미나이가 칸을 채웠습니다. 틀린 곳을 고친 뒤 저장하세요." : "글자를 찾지 못했습니다. 텍스트 스캔을 이용해 주세요.");
    } catch (err) {
      if (sheet !== s) return;
      const st = err?.status;
      const msg = st === 400 || st === 403 ? "API 키가 맞지 않거나 모델 이름이 틀렸습니다. 제미나이 설정을 확인해 주세요."
        : st === 404 ? "모델을 찾을 수 없습니다. 제미나이 설정에서 모델 이름을 확인해 주세요."
        : st === 429 ? "제미나이 무료 한도에 걸렸습니다. 잠시 후 다시 하거나 텍스트 스캔을 이용해 주세요."
        : "제미나이로 읽지 못했습니다. 인터넷 연결을 확인하거나 텍스트 스캔을 이용해 주세요.";
      setStatus(msg, "err");
    }
  }

  function saveEdit() {
    if (!sheet || sheet.kind !== "edit") return;
    const c = { ...sheet.card };
    for (const [k] of FIELDS) { const el = $("f-" + k); if (el) c[k] = el.value.trim(); }
    if (FIELDS.every(([k]) => !c[k])) { showToast("이름이나 연락처를 한 가지 이상 입력해 주세요."); return; }
    if (!c.id) { c.id = newId(); c.createdAt = Date.now(); }
    c.updatedAt = Date.now();
    const i = cards.findIndex(x => x.id === c.id);
    if (i >= 0) cards[i] = c; else cards.push(c);
    sortCards();
    if (!saveCards()) { showToast("저장하지 못했습니다. Safari 설정에서 방문 기록·웹사이트 데이터 차단을 확인해 주세요."); return; }
    renderList();
    showToast("저장했습니다");
    openDetail(c, true);
  }

  function openDetail(c, justSaved) {
    sheet = { kind: "detail", card: c, armed: false };
    const tel = (v) => v ? `<a href="tel:${esc(digits(v))}">${esc(v)}</a>` : "";
    const row = (label, value, o = {}) => !value ? "" : `<div class="row"><span class="k">${label}</span><span class="v ${o.mono ? "mono" : ""}">${o.html || esc(value)}</span><button class="btn small" type="button" data-copy="${esc(value)}">복사</button></div>`;
    const site = c.website ? (/^https?:\/\//i.test(c.website) ? c.website : "https://" + c.website) : "";
    const rows = [
      row("휴대폰", c.mobile, { mono: true, html: tel(c.mobile) }),
      row("전화", c.phone, { mono: true, html: tel(c.phone) }),
      row("팩스", c.fax, { mono: true }),
      row("이메일", c.email, { mono: true, html: `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` }),
      row("웹사이트", c.website, { mono: true, html: `<a href="${esc(site)}" target="_blank" rel="noopener">${esc(c.website)}</a>` }),
      row("주소", c.address, { html: `<a href="https://map.naver.com/p/search/${encodeURIComponent(c.address || "")}" target="_blank" rel="noopener">${esc(c.address)}</a>` })
    ].join("");
    const created = c.createdAt ? new Date(c.createdAt).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" }) : "";
    openSheet(`
      ${bar(`<button class="linkbtn" type="button" data-act="close">‹ 목록</button>`, "명함", `<button class="linkbtn" type="button" data-act="edit">편집</button>`)}
      <div class="sheet-body">
        ${c.thumb ? `<div class="photo"><img src="${esc(c.thumb)}" alt="명함 사진"></div>` : ""}
        <div class="hero-name">
          <span class="n">${esc(c.name || "이름 없음")}${c.jobTitle ? `<small>${esc(c.jobTitle)}</small>` : ""}</span>
          ${c.company || c.department ? `<span class="o">${esc([c.company, c.department].filter(Boolean).join(" · "))}</span>` : ""}
        </div>
        <div class="stack">
          <button class="btn primary" type="button" data-act="contact">아이폰 연락처에 저장</button>
          ${justSaved ? `<p class="note">누른 뒤 뜨는 화면에서 <b>새로운 연락처 생성</b>을 누르면 저장됩니다.</p>` : ""}
        </div>
        ${rows ? `<div class="group">${rows}</div>` : `<p class="note">저장된 연락처가 없습니다.</p>`}
        ${c.memo ? `<div><p class="group-title">메모</p><div class="group memo">${esc(c.memo)}</div></div>` : ""}
        <button class="btn danger" type="button" data-act="delete">명함 삭제</button>
        ${created ? `<p class="foot">${esc(created)} 등록</p>` : ""}
      </div>`);
  }

  function openSettings() {
    sheet = { kind: "settings" };
    openSheet(`
      ${bar(`<button class="linkbtn" type="button" data-act="close">닫기</button>`, "제미나이 설정", `<button class="linkbtn strong" type="button" data-act="saveSettings">저장</button>`)}
      <div class="sheet-body settings">
        <p class="note">키를 넣으면 <b>명함 사진</b>을 찍을 때 제미나이가 글자를 읽습니다. 키가 없어도 텍스트 스캔으로 무료로 쓸 수 있습니다.</p>
        <div class="group">
          <div class="field"><label for="gKey">API 키</label><input id="gKey" type="password" value="${esc(gemini.key)}" placeholder="AIza…" autocomplete="off" autocapitalize="off" autocorrect="off"></div>
          <div class="field"><label for="gModel">모델</label><input id="gModel" value="${esc(gemini.model || DEFAULT_MODEL)}" autocomplete="off" autocapitalize="off" autocorrect="off"></div>
        </div>
        <ol class="steps">
          <li><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--accent)">Google AI Studio</a>에 구글 계정으로 로그인</li>
          <li><b>Create API key</b>로 키를 만들어 복사한 뒤 위 칸에 붙여넣기</li>
          <li>무료 요금제는 보낸 내용이 구글 제품 개선에 쓰일 수 있습니다.</li>
          <li>키는 이 아이폰에만 저장되고 구글 외 다른 곳으로 보내지 않습니다.</li>
        </ol>
        ${gemini.key ? `<div class="status">키가 저장되어 있습니다. 키를 다시 넣지 않으려면 <b>&nbsp;아래 순서로 홈 화면 아이콘을 한 번 다시 만들어 주세요.</b></div>
        <ol class="steps">
          <li>지금 주소창 주소 끝에 <b>#k=…</b>가 붙어 있습니다. 이 주소에 키가 담겨 있습니다.</li>
          <li>기존 홈 화면 아이콘을 지우고, 지금 화면에서 공유(□↑) → <b>홈 화면에 추가</b>를 누릅니다.</li>
          <li>이제 그 아이콘으로 열면 브라우저가 저장소를 지워도 키가 자동으로 다시 들어갑니다.</li>
          <li>이 주소는 다른 사람에게 보내지 마세요. 키가 함께 전달됩니다.</li>
        </ol>
        <button class="btn small" type="button" data-act="copyKeyUrl">키가 담긴 주소 복사 (북마크용)</button>` : ""}
        ${gemini.key ? `<button class="btn danger" type="button" data-act="clearKey">키 지우기</button>` : ""}
      </div>`);
  }

  function openBackup() {
    sheet = { kind: "backup" };
    openSheet(`
      ${bar(`<button class="linkbtn" type="button" data-act="close">닫기</button>`, "백업 · 복원", "")}
      <div class="sheet-body">
        <p class="note">명함은 이 아이폰의 Safari에만 저장됩니다. Safari 방문 기록을 지우면 함께 지워지니 가끔 백업 파일을 '파일' 앱에 저장해 두세요.</p>
        <div class="stack">
          <button class="btn primary" type="button" data-act="exportJson" ${cards.length ? "" : "disabled"}>백업 파일 저장 (${cards.length}장)</button>
          <label class="btn filebtn">백업 파일에서 복원<input id="importIn" type="file" accept=".json,application/json"></label>
          <button class="btn" type="button" data-act="exportAllVcf" ${cards.length ? "" : "disabled"}>전체를 연락처 파일로 저장</button>
        </div>
      </div>`);
    $("importIn").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0]; e.target.value = "";
      if (!file) return;
      try {
        const arr = JSON.parse(await file.text());
        if (!Array.isArray(arr)) throw 0;
        let added = 0;
        for (const raw of arr) {
          if (!raw || typeof raw !== "object") continue;
          const c = { ...blankCard(), thumb: "" };
          for (const [k] of FIELDS) c[k] = typeof raw[k] === "string" ? raw[k] : "";
          c.thumb = typeof raw.thumb === "string" && raw.thumb.startsWith("data:image/") ? raw.thumb : "";
          c.id = typeof raw.id === "string" ? raw.id : newId();
          c.createdAt = Number(raw.createdAt) || Date.now();
          const i = cards.findIndex(x => x.id === c.id);
          if (i >= 0) cards[i] = c; else { cards.push(c); added++; }
        }
        sortCards(); saveCards(); renderList();
        showToast(`복원했습니다 (새 명함 ${added}장)`);
        closeSheet();
      } catch { showToast("백업 파일을 읽지 못했습니다."); }
    });
  }

  // ================= sheet events =================
  $("sheet").addEventListener("click", async (e) => {
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      try { await navigator.clipboard.writeText(cp.dataset.copy); showToast("복사했습니다"); }
      catch { showToast("복사하지 못했습니다. 글자를 길게 눌러 복사해 주세요."); }
      return;
    }
    const btn = e.target.closest("[data-act]");
    const act = btn?.dataset.act;
    if (!act) return;
    const s = sheet;
    if (act === "close") closeSheet();
    else if (act === "save") saveEdit();
    else if (act === "edit" && s) openEdit({ ...s.card });
    else if (act === "contact" && s) addToContacts(s.card);
    else if (act === "recrop" && s) recrop(s);
    else if (act === "paste") {
      try {
        const t = await navigator.clipboard.readText();
        if (!t.trim()) { showToast("복사된 글자가 없습니다."); return; }
        $("scanText").value = t; fillFromText(t);
      } catch { showToast("붙여넣기가 막혔습니다. 위 칸을 길게 눌러 붙여넣기 해 주세요."); }
    }
    else if (act === "delete" && s) {
      if (!s.armed) {
        s.armed = true; btn.classList.add("armed"); btn.textContent = "한 번 더 누르면 삭제됩니다";
        setTimeout(() => { if (sheet === s && s.armed) { s.armed = false; btn.classList.remove("armed"); btn.textContent = "명함 삭제"; } }, 4000);
        return;
      }
      cards = cards.filter(x => x.id !== s.card.id); saveCards(); renderList(); closeSheet(); showToast("삭제했습니다");
    }
    else if (act === "saveSettings") {
      saveGemini({ key: $("gKey").value.trim(), model: $("gModel").value.trim() || DEFAULT_MODEL });
      if (gemini.key) { openSettings(); showToast("저장했습니다. 아래 안내대로 홈 화면에 추가해 주세요"); }
      else { closeSheet(); showToast("설정을 저장했습니다"); }
    }
    else if (act === "clearKey") {
      saveGemini({ key: "", model: gemini.model || DEFAULT_MODEL }); closeSheet(); showToast("키를 지웠습니다");
    }
    else if (act === "copyKeyUrl") {
      try { await navigator.clipboard.writeText(keyHashUrl(gemini)); showToast("주소를 복사했습니다"); }
      catch { showToast("복사하지 못했습니다. 주소창의 주소를 길게 눌러 복사해 주세요."); }
    }
    else if (act === "exportJson") {
      const d = new Date(); const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
      downloadFile(`명함첩-백업-${stamp}.json`, JSON.stringify(cards), "application/json");
    }
    else if (act === "exportAllVcf") {
      downloadFile("명함첩-전체.vcf", cards.map(toVCard).join(""), "text/vcard");
    }
  });

  let toastTimer;
  function showToast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  // 테스트용 (브라우저 콘솔에서 확인 가능)
  window.__parseCardText = parseCardText;
  window.__card = { findCardQuad, warpQuad, cardAspect };
  renderList();
  // 키가 있으면 주소에 담아 둠 (홈 화면 아이콘·북마크로 복구 가능)
  if (gemini.key && !geminiFromHash()) { try { history.replaceState(null, "", keyHashUrl(gemini)); } catch {} }

  // localStorage가 비었으면 IndexedDB에서 복구
  (async () => {
    const [idbCards, idbGem] = await Promise.all([idb.get(KEY_CARDS), idb.get(KEY_GEMINI)]);
    if (!cards.length && Array.isArray(idbCards) && idbCards.length) {
      cards = idbCards; sortCards(); store(KEY_CARDS, cards); renderList();
    } else if (cards.length && !idbCards) {
      idb.set(KEY_CARDS, cards);
    }
    if (!gemini.key && idbGem && idbGem.key) {
      saveGemini(idbGem);
    } else if (gemini.key && !(idbGem && idbGem.key)) {
      idb.set(KEY_GEMINI, gemini);
    }
  })();
})();
</script>
</body>
</html>
